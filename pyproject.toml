[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "phantom-flow"
version = "0.1.0a0"
description = "A small, local-first YAML workflow runner for the phantom-mesh ecosystem."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Mark Lai" }]
keywords = ["workflow", "yaml", "automation", "local-first", "phantom-mesh"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Distributed Computing",
    "Topic :: Utilities",
]

# CORE runtime deps only — the engine is intentionally near-stdlib.
# PyYAML (flow parsing) is the single hard dependency.
dependencies = [
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/markl-a/phantom-flow"
Documentation = "https://github.com/markl-a/phantom-flow/tree/main/docs"
Issues = "https://github.com/markl-a/phantom-flow/issues"
Source = "https://github.com/markl-a/phantom-flow"

[project.optional-dependencies]
# YouTube transcript fetching is optional; the youtube-summarize flow falls
# back to a bundled cached transcript when this is not installed.
youtube = ["youtube-transcript-api>=0.6"]
# Test tooling.
dev = ["pytest>=7", "ruff>=0.6"]
# MCP server (phantom_flow.mcp_server) the mesh launches — optional so the
# core YAML engine stays near-stdlib. Install with `pip install .[mcp]`.
mcp = ["mcp>=1"]

[project.scripts]
phantom-flow = "phantom_flow.runner:_main"
phantom-flow-mcp = "phantom_flow.mcp_server:main"

[tool.setuptools]
# Only the engine package ships; the vendored subtrees are staged sources,
# not part of the installable distribution.
packages = ["phantom_flow"]
