name: CI
on:
  push:
    branches: [master, main, oss-sprint-prep]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml pytest
      - name: import smoke
        run: python -c "from phantom_flow.runner import load_flow, run_flow; print('phantom-flow runner import ok')"
      - name: pytest
        run: pytest -q
